<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biya Fashion | Grand Opening</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* =========================
   GRAND OPENING SCREEN
========================= */

#openingScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background:
    radial-gradient(circle at center, #0b704b 0%, #064d32 40%, #021f14 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

.openingContent {
  width: 90%;
  max-width: 500px;
  text-align: center;
  position: relative;
  z-index: 5;
}

/* Gold circles */

.circle {
  position: absolute;
  border: 1px solid rgba(212,175,55,0.45);
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  animation: rotateCircle 8s linear infinite;
}

.circle.one {
  width: 320px;
  height: 320px;
}

.circle.two {
  width: 430px;
  height: 430px;
  animation-direction: reverse;
  animation-duration: 12s;
}

.circle.three {
  width: 540px;
  height: 540px;
  animation-duration: 18s;
}

@keyframes rotateCircle {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

/* Logo */

.openingLogo {
  width: 130px;
  height: 130px;
  object-fit: contain;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 20px rgba(212,175,55,0.5));
  animation: logoAppear 1.2s ease;
}

@keyframes logoAppear {
  from {
    opacity: 0;
    transform: scale(0.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Text */

.smallText {
  font-size: 14px;
  letter-spacing: 4px;
  color: #d4af37;
  margin-bottom: 12px;
  font-weight: bold;
}

.specialText {
  font-size: 27px;
  font-weight: bold;
  color: white;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.guestName {
  font-size: 22px;
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 35px;
}

/* Start button */

#startButton {
  border: none;
  outline: none;
  background: linear-gradient(135deg, #d4af37, #f3d477);
  color: #063b28;
  padding: 15px 50px;
  border-radius: 50px;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  transition: 0.3s;
}

#startButton:hover {
  transform: scale(1.06);
}

/* Countdown */

#countdown {
  display: none;
  font-size: 110px;
  font-weight: bold;
  color: #d4af37;
  text-shadow: 0 0 30px rgba(212,175,55,0.7);
}

.countAnimation {
  animation: countZoom 0.9s ease;
}

@keyframes countZoom {
  0% {
    opacity: 0;
    transform: scale(1.8);
  }

  50% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0.9;
    transform: scale(0.9);
  }
}

/* Grand opening text */

#grandOpening {
  display: none;
}

#grandOpening h1 {
  font-size: 40px;
  color: #d4af37;
  margin: 0 0 12px;
  text-shadow: 0 0 25px rgba(212,175,55,0.6);
}

#grandOpening p {
  font-size: 20px;
  letter-spacing: 3px;
  margin: 0;
}

/* Opening fade */

.fadeOut {
  animation: fadeAway 1.5s ease forwards;
}

@keyframes fadeAway {
  from {
    opacity: 1;
  }

  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* =========================
   SAMPLE BIYA FASHION WEBSITE
========================= */

#website {
  min-height: 100vh;
  background: #fff;
  color: #222;
}

.navbar {
  background: #064d32;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

.hero {
  padding: 70px 20px;
  text-align: center;
  background: #f8f5ed;
}

.hero h1 {
  color: #064d32;
  font-size: 42px;
}

.hero p {
  font-size: 18px;
}

.shopButton {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 30px;
  background: #064d32;
  color: white;
  text-decoration: none;
  border-radius: 30px;
}
</style>
</head>

<body>

<!-- =========================
     GRAND OPENING
========================= -->

<div id="openingScreen">

  <div class="circle one"></div>
  <div class="circle two"></div>
  <div class="circle three"></div>

  <div class="openingContent">

    <img
      src="logo-board.png"
      class="openingLogo"
      alt="Biya Fashion Logo"
    >

    <div class="smallText">
      BIYA FASHION
    </div>

    <div class="specialText">
      MY SPECIAL ONE 💙
    </div>

    <div class="guestName" id="guestName">
      Miss. Karthika
    </div>

    <button id="startButton">
      START
    </button>

    <div id="countdown"></div>

    <div id="grandOpening">
      <h1>✨ GRAND OPENING ✨</h1>
      <p>BIYA FASHION</p>
    </div>

  </div>

</div>


<!-- =========================
     WEBSITE
========================= -->

<div id="website">

  <div class="navbar">
    BIYA FASHION
  </div>

  <section class="hero">

    <h1>Welcome to Biya Fashion</h1>

    <p>
      Premium T-Shirts & Casual Wear
    </p>

    <p>
      Starting from ₹399
    </p>

    <a
      class="shopButton"
      href="https://wa.me/919655625186"
    >
      Order on WhatsApp
    </a>

  </section>

</div>


<script>

/* ==================================
   GUEST NAME FROM URL
================================== */

const guests = {

  karthika: "Miss. Karthika",

  sanjay: "Mrs. Sanjay Snekha",

  thangapandii: "Mr. Thangapandii",

  sabiya: "Miss. Sabiya Banu"

};

const params = new URLSearchParams(window.location.search);

const guestKey = params.get("guest");

const guestName = guests[guestKey] || "Miss. Karthika";

document.getElementById("guestName").textContent = guestName;


/* ==================================
   START BUTTON
================================== */

const startButton = document.getElementById("startButton");
const countdown = document.getElementById("countdown");
const grandOpening = document.getElementById("grandOpening");
const openingScreen = document.getElementById("openingScreen");

startButton.addEventListener("click", function () {

  /* Hide START button */

  startButton.style.display = "none";

  /* Hide guest text */

  document.querySelector(".specialText").style.display = "none";
  document.querySelector(".guestName").style.display = "none";
  document.querySelector(".smallText").style.display = "none";
  document.querySelector(".openingLogo").style.display = "none";

  /* Show countdown */

  countdown.style.display = "block";

  let numbers = ["3", "2", "1"];
  let index = 0;

  function showNumber() {

    countdown.textContent = numbers[index];

    countdown.classList.remove("countAnimation");

    /* Restart animation */

    void countdown.offsetWidth;

    countdown.classList.add("countAnimation");

    index++;

    if (index < numbers.length) {

      setTimeout(showNumber, 1000);

    } else {

      setTimeout(showGrandOpening, 1000);

    }
  }

  showNumber();

});


/* ==================================
   GRAND OPENING
================================== */

function showGrandOpening() {

  countdown.style.display = "none";

  grandOpening.style.display = "block";

  grandOpening.style.animation =
    "logoAppear 1.5s ease";

  /* Wait and open website */

  setTimeout(function () {

    openingScreen.classList.add("fadeOut");

    document.body.style.overflow = "auto";

    setTimeout(function () {
      openingScreen.style.display = "none";
    }, 1500);

  }, 2200);

}


/* Prevent scrolling during opening */

document.body.style.overflow = "hidden";

</script>

</body>
</html>
